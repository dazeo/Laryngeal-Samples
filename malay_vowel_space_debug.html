<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malay Vowel Space — DEBUG</title>
<style>
  body {
    background: #eae7e0;
    color: #2a2825;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }
  h1 { font-size: 16px; letter-spacing: 0.05em; margin-bottom: 4px; }
  p.sub { color: #7a7568; font-size: 12px; margin-top: 0; margin-bottom: 16px; text-align:center; }
  #pad {
    width: 320px;
    height: 320px;
    background: #e5e1d8;
    border: 1px solid #cfcabd;
    position: relative;
  }
  .vpoint {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #6b6558;
    transform: translate(-50%, -50%);
  }
  .vpoint.schwa { background: #b5622f; }
  .vlabel {
    position: absolute;
    font-size: 13px;
    transform: translate(-50%, -160%);
    color: #4a463d;
  }
  .vlabel.schwa { color: #b5622f; }
  svg#lines { position: absolute; top:0; left:0; width:100%; height:100%; }
  #cursor {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #c76a3a;
    opacity: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: opacity 0.15s;
  }
  #cursor.active { opacity: 0.85; }
  #pad { touch-action: none; cursor: pointer; }
  button {
    font-size: 15px;
    padding: 10px 16px;
    margin-top: 14px;
    border-radius: 8px;
    border: none;
    background: #c76a3a;
    color: white;
    width: 100%;
    max-width: 320px;
  }
  #log {
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 11.5px;
    background: #e5e1d8;
    border: 1px solid #cfcabd;
    padding: 10px;
    width: 100%;
    max-width: 320px;
    min-height: 260px;
    margin-top: 14px;
  }
</style>
</head>
<body>

<h1>MALAY VOWEL SPACE — DEBUG版</h1>
<p class="sub">パッドをタップ・ドラッグしてください。下にログが出ます。<br>音が出なくても、ログの内容をそのまま教えてください。</p>

<div id="pad">
  <svg id="lines"></svg>
  <div id="cursor"></div>
</div>

<button id="stateBtn">現在の状態を表示 (Check state)</button>
<div id="log">(ここにログが出ます)</div>

<script>
const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
log("UA: " + navigator.userAgent.slice(0, 80));

const vowels = {
  i:    { f1: 436.8, f2: 2192.2, schwa: false },
  "é":  { f1: 528.2, f2: 1856.5, schwa: false },
  "ε":  { f1: 677.5, f2: 1905.7, schwa: false },
  a:    { f1: 827.2, f2: 1538.5, schwa: false },
  "ɔ":  { f1: 667.9, f2: 1304.4, schwa: false },
  o:    { f1: 576.9, f2: 1165.6, schwa: false },
  u:    { f1: 485.4, f2: 1157.6, schwa: false },
  e:    { f1: 518.9, f2: 1558.0, schwa: true  },
};

const F1_MIN = 200, F1_MAX = 900;
const F2_MIN = 600, F2_MAX = 2600;

function toXY(f1, f2) {
  const y = (f1 - F1_MIN) / (F1_MAX - F1_MIN);
  const x = (F2_MAX - f2) / (F2_MAX - F2_MIN);
  return { x: x * 100, y: y * 100 };
}

const pad = document.getElementById("pad");
const svg = document.getElementById("lines");
const perimeterOrder = ["i", "é", "ε", "a", "ɔ", "o", "u"];

let points = {};
for (const key in vowels) {
  const v = vowels[key];
  const { x, y } = toXY(v.f1, v.f2);
  points[key] = { x, y, schwa: v.schwa };
  const dot = document.createElement("div");
  dot.className = "vpoint" + (v.schwa ? " schwa" : "");
  dot.style.left = x + "%";
  dot.style.top = y + "%";
  pad.appendChild(dot);
  const label = document.createElement("div");
  label.className = "vlabel" + (v.schwa ? " schwa" : "");
  label.style.left = x + "%";
  label.style.top = y + "%";
  label.textContent = key;
  pad.appendChild(label);
}
let pathPts = perimeterOrder.map(k => `${points[k].x}%,${points[k].y}%`);
pathPts.push(pathPts[0]);
const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
polyline.setAttribute("points", pathPts.map(p => {
  const [x,y] = p.split(",");
  return x.replace("%","") * 3.2 + "," + y.replace("%","") * 3.2;
}).join(" "));
polyline.setAttribute("fill", "none");
polyline.setAttribute("stroke", "#a29c8c");
polyline.setAttribute("stroke-width", "1");
svg.appendChild(polyline);

// ---- Audio, with logging at every step ----
let ctx, osc, gainMaster, filter1, filter2, compressor, makeupGain, started = false;

function ensureAudio() {
  if (started) {
    log("ensureAudio: already started, reusing existing ctx (state=" + ctx.state + ")");
    return;
  }
  log("ensureAudio: building audio graph...");
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    log("  ctx created. state=" + ctx.state + " sampleRate=" + ctx.sampleRate);

    osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 110;

    gainMaster = ctx.createGain();
    gainMaster.gain.value = 0;

    filter1 = ctx.createBiquadFilter();
    filter1.type = "bandpass";
    filter1.Q.value = 12;

    filter2 = ctx.createBiquadFilter();
    filter2.type = "bandpass";
    filter2.Q.value = 12;

    compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -50;
    compressor.knee.value = 10;
    compressor.ratio.value = 20;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.25;

    makeupGain = ctx.createGain();
    makeupGain.gain.value = 3.5;

    osc.connect(filter1);
    osc.connect(filter2);
    filter1.connect(gainMaster);
    filter2.connect(gainMaster);
    gainMaster.connect(compressor);
    compressor.connect(makeupGain);
    makeupGain.connect(ctx.destination);

    osc.start();
    log("  osc.start() called OK.");
    started = true;
  } catch (e) {
    log("  EXCEPTION in ensureAudio: " + e.name + " - " + e.message);
  }
}

function fromXY(xPercent, yPercent) {
  const f1 = F1_MIN + (yPercent / 100) * (F1_MAX - F1_MIN);
  const f2 = F2_MAX - (xPercent / 100) * (F2_MAX - F2_MIN);
  return { f1, f2 };
}

function setFormants(f1, f2) {
  const now = ctx.currentTime;
  filter1.frequency.setTargetAtTime(f1, now, 0.02);
  filter2.frequency.setTargetAtTime(f2, now, 0.02);
}

const cursor = document.getElementById("cursor");
let dragging = false;
let moveCount = 0;

function pointerToPad(evt) {
  const rect = pad.getBoundingClientRect();
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  let x = ((clientX - rect.left) / rect.width) * 100;
  let y = ((clientY - rect.top) / rect.height) * 100;
  x = Math.max(0, Math.min(100, x));
  y = Math.max(0, Math.min(100, y));
  return { x, y };
}

function handleMove(evt) {
  if (!dragging) return;
  evt.preventDefault();
  const { x, y } = pointerToPad(evt);
  cursor.style.left = x + "%";
  cursor.style.top = y + "%";
  const { f1, f2 } = fromXY(x, y);
  setFormants(f1, f2);
  moveCount++;
  if (moveCount % 15 === 1) {
    log("move: f1=" + f1.toFixed(0) + " f2=" + f2.toFixed(0) + " ctx.state=" + (ctx ? ctx.state : "none") + " gain=" + (gainMaster ? gainMaster.gain.value.toFixed(2) : "none"));
  }
}

function handleStart(evt) {
  log("--- touchstart/mousedown fired ---");
  try {
    ensureAudio();
    log("  after ensureAudio: ctx.state=" + ctx.state);
    if (ctx.state !== "running") {
      log("  ctx not running (" + ctx.state + "), calling resume()...");
      ctx.resume().then(() => log("  resume() resolved. new state=" + ctx.state))
                   .catch(e => log("  resume() REJECTED: " + e));
    }
    dragging = true;
    cursor.classList.add("active");
    gainMaster.gain.setTargetAtTime(0.25, ctx.currentTime, 0.03);
    log("  gainMaster target set to 0.25. current value=" + gainMaster.gain.value.toFixed(3));
    handleMove(evt);
  } catch (e) {
    log("  EXCEPTION in handleStart: " + e.name + " - " + e.message);
  }
}

function handleEnd() {
  if (!dragging) return;
  dragging = false;
  cursor.classList.remove("active");
  if (gainMaster) gainMaster.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
  log("--- touchend/mouseup ---");
}

pad.addEventListener("mousedown", handleStart);
pad.addEventListener("mousemove", handleMove);
window.addEventListener("mouseup", handleEnd);
pad.addEventListener("touchstart", handleStart, { passive: false });
pad.addEventListener("touchmove", handleMove, { passive: false });
pad.addEventListener("touchend", handleEnd);

document.getElementById("stateBtn").addEventListener("click", () => {
  if (!ctx) {
    log("[state check] AudioContext not created yet (haven't touched pad).");
    return;
  }
  log("[state check] ctx.state=" + ctx.state +
      " gainMaster.gain=" + gainMaster.gain.value.toFixed(3) +
      " filter1.freq=" + filter1.frequency.value.toFixed(0) +
      " filter2.freq=" + filter2.frequency.value.toFixed(0) +
      " baseLatency=" + (ctx.baseLatency !== undefined ? ctx.baseLatency : "n/a"));
});
</script>

</body>
</html>
