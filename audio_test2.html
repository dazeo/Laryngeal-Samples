<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Audio Node Isolation Test</title>
<style>
  body {
    background: #eae7e0;
    color: #2a2825;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  h1 { font-size: 17px; }
  p { font-size: 13px; max-width: 480px; text-align: center; }
  button {
    font-size: 16px;
    padding: 14px 20px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    background: #c76a3a;
    color: white;
    width: 100%;
    max-width: 480px;
  }
  #log {
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 12px;
    background: #e5e1d8;
    border: 1px solid #cfcabd;
    padding: 12px;
    width: 100%;
    max-width: 480px;
    min-height: 220px;
    margin-top: 16px;
  }
</style>
</head>
<body>

<h1>Web Audio ノード別テスト</h1>
<p>各ボタンを順番に押して、どれが鳴ってどれが鳴らないか教えてください。
1つずつ試すのがポイントです。</p>

<button id="btnA">A: オシレーター→単一バンドパスフィルタ</button>
<button id="btnB">B: オシレーター→2つの並列バンドパスフィルタ</button>
<button id="btnC">C: オシレーター→ゲイン→コンプレッサー</button>
<button id="btnD">D: A+B+C全部乗せ(実際のvowelページと同じ構成)</button>

<div id="log">(ここにログが出ます)</div>

<script>
const logEl = document.getElementById("log");
function log(msg) { logEl.textContent += msg + "\n"; }

function runTest(name, buildGraph) {
  logEl.textContent = "";
  log("=== " + name + " ===");
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    log("AudioContext created. state=" + ctx.state);
    ctx.resume().then(() => log("resume() resolved. state=" + ctx.state))
                 .catch(e => log("resume ERROR: " + e));
    buildGraph(ctx);
    log("Graph built and oscillator started.");
    setTimeout(() => {
      log("(1.2 sec elapsed — if you heard nothing, this path is silent)");
    }, 1200);
  } catch (e) {
    log("EXCEPTION: " + e.name + " - " + e.message);
  }
}

document.getElementById("btnA").addEventListener("click", () => {
  runTest("A: single bandpass filter", (ctx) => {
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 110;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 12;
    filter.frequency.value = 700; // near a harmonic of 110 (7th = 770, close enough with Q=12)
    const gain = ctx.createGain();
    gain.gain.value = 0.6;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  });
});

document.getElementById("btnB").addEventListener("click", () => {
  runTest("B: two parallel bandpass filters", (ctx) => {
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 110;
    const f1 = ctx.createBiquadFilter();
    f1.type = "bandpass"; f1.Q.value = 12; f1.frequency.value = 440;
    const f2 = ctx.createBiquadFilter();
    f2.type = "bandpass"; f2.Q.value = 12; f2.frequency.value = 1540;
    const gain = ctx.createGain();
    gain.gain.value = 0.6;
    osc.connect(f1);
    osc.connect(f2);
    f1.connect(gain);
    f2.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  });
});

document.getElementById("btnC").addEventListener("click", () => {
  runTest("C: oscillator -> gain -> compressor", (ctx) => {
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 220;
    const gain = ctx.createGain();
    gain.gain.value = 0.3;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50;
    comp.knee.value = 10;
    comp.ratio.value = 20;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    const makeup = ctx.createGain();
    makeup.gain.value = 3.5;
    osc.connect(gain);
    gain.connect(comp);
    comp.connect(makeup);
    makeup.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  });
});

document.getElementById("btnD").addEventListener("click", () => {
  runTest("D: full chain (like the vowel pages)", (ctx) => {
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 110;
    const gainMaster = ctx.createGain();
    gainMaster.gain.value = 0.25;
    const f1 = ctx.createBiquadFilter();
    f1.type = "bandpass"; f1.Q.value = 12; f1.frequency.value = 440;
    const f2 = ctx.createBiquadFilter();
    f2.type = "bandpass"; f2.Q.value = 12; f2.frequency.value = 1540;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50;
    comp.knee.value = 10;
    comp.ratio.value = 20;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    const makeup = ctx.createGain();
    makeup.gain.value = 3.5;
    osc.connect(f1);
    osc.connect(f2);
    f1.connect(gainMaster);
    f2.connect(gainMaster);
    gainMaster.connect(comp);
    comp.connect(makeup);
    makeup.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  });
});
</script>

</body>
</html>
